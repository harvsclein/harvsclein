    </tspan>

    <tspan x="462" dy="27">
      Role       . . . . . . . . . . . . . BSIT Student
    </tspan>

    <tspan x="462" dy="27">
      Origin     . . . . . . . . . . . . . Bulacan, Philippines
    </tspan>

    <tspan x="462" dy="27">
      Education  . . . . . . . . . . . . . BS Information Technology
    </tspan>

    <tspan x="462" dy="27">
      Status     . . . . . . . . . . . . . Building • Learning • Shipping
    </tspan>

    <tspan x="462" dy="27">
      ToolChain  . . . . . . . . . . . . . Python • SQL • Power BI • Git
    </tspan>

  </text>

