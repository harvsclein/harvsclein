  <line x1="38" y1="115" x2="395" y2="115"
        stroke="#00E5FF"
        stroke-opacity="0.35"/>

  <!-- ASCII / Logo -->
  <text x="38" y="165"
        fill="#00E5FF"
        font-family="monospace, Courier New, Consolas"
        font-size="15"
        xml:space="preserve">

    <tspan x="38" dy="0">        ╔══════════════════════╗</tspan>
    <tspan x="38" dy="22">        ║                      ║</tspan>
    <tspan x="38" dy="22">        ║      H A R V Y     ║</tspan>
    <tspan x="38" dy="22">        ║                      ║</tspan>
    <tspan x="38" dy="22">        ║       &lt;/&gt;           ║</tspan>
    <tspan x="38" dy="22">        ║                      ║</tspan>
    <tspan x="38" dy="22">        ║   DATA • CODE • IT  ║</tspan>
    <tspan x="38" dy="22">        ║                      ║</tspan>
    <tspan x="38" dy="22">        ╚══════════════════════╝</tspan>

  </text>

  <!-- Decorative system text -->
  <text x="38" y="410"
        fill="#8B949E"
        font-family="monospace, Courier New, Consolas"
        font-size="12">

    <tspan x="38" dy="0">┌─ SYSTEM</tspan>
    <tspan x="38" dy="21">│</tspan>
    <tspan x="38" dy="21">├─ MODE     : STUDENT</tspan>
    <tspan x="38" dy="21">├─ DOMAIN   : DATA / SOFTWARE</tspan>
    <tspan x="38" dy="21">├─ SIGNAL   : ACTIVE</tspan>
    <tspan x="38" dy="21">└─ STATUS   : BUILDING</tspan>

  </text>

  <!-- Progress bar -->
  <text x="38" y="555"
        fill="#00F2FE"
        font-family="monospace, Courier New, Consolas"
        font-size="12">
    SYSTEM.PROGRESS
  </text>

  <rect x="38" y="570"
        width="350"
        height="12"
        rx="3"
        fill="#161B22"
        stroke="#00E5FF"
        stroke-opacity="0.25"/>

  <rect x="40" y="572"
        width="255"
        height="8"
        rx="2"
        fill="#00E5FF"/>

  <text x="38" y="610"
        fill="#8B949E"
        font-family="monospace, Courier New, Consolas"
