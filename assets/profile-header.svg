<svg width="1200" height="720" viewBox="0 0 1200 720"
     xmlns="http://www.w3.org/2000/svg">

  <!-- =========================================================
       BACKGROUND
  ========================================================== -->
  <rect width="1200" height="720" rx="14" fill="#0B0F19"/>

  <!-- Outer terminal frame -->
  <rect x="1" y="1" width="1198" height="718" rx="14"
        fill="none" stroke="#00E5FF" stroke-opacity="0.35"/>

  <!-- =========================================================
       TOP TERMINAL BAR
  ========================================================== -->
  <rect x="1" y="1" width="1198" height="58" rx="14" fill="#0D1117"/>

  <!-- Flatten bottom corners of top bar -->
  <rect x="1" y="30" width="1198" height="29" fill="#0D1117"/>

  <!-- macOS controls -->
  <circle cx="28" cy="29" r="7" fill="#FF5F56"/>
  <circle cx="51" cy="29" r="7" fill="#FFBD2E"/>
  <circle cx="74" cy="29" r="7" fill="#27C93F"/>

     <defs>
  <linearGradient id="scanlineGradient" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#00F2FE" stop-opacity="0"/>
    <stop offset="50%" stop-color="#00F2FE" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#00F2FE" stop-opacity="0"/>
  </linearGradient>

  <filter id="cyanGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>

     <rect x="3" y="80"
      width="1194"
      height="3"
      fill="url(#scanlineGradient)"
      opacity="0.8"/>
     
  <!-- Terminal title -->
  <text x="600" y="35"
        text-anchor="middle"
        fill="#8B949E"
        font-family="monospace, Courier New, Consolas"
        font-size="15">
    harvsclein@devos ~ % ./profile.sh --live
  </text>

  <!-- Status -->
  <text x="1168" y="35"
        text-anchor="end"
        fill="#00F2FE"
        font-family="monospace, Courier New, Consolas"
        font-size="13"
        font-weight="bold">
    [ONLINE]
  </text>

