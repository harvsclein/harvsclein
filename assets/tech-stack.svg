<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="500"
     viewBox="0 0 1200 500">

  <defs>

    <!-- Background -->
    <radialGradient id="bgGlow"
                    cx="50%"
                    cy="0%"
                    r="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="60%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#050810"/>
    </radialGradient>

    <!-- Border -->
    <linearGradient id="borderGrad"
                    x1="0%"
                    y1="0%"
                    x2="100%"
                    y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Scanline -->
    <linearGradient id="scanGrad"
                    x1="0%"
                    y1="0%"
                    x2="0%"
                    y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="44%" stop-color="#00E5FF" stop-opacity="0.02"/>
      <stop offset="50%" stop-color="#B6F7FF" stop-opacity="0.55"/>
      <stop offset="56%" stop-color="#00E5FF" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>

    <!-- CRT lines -->
    <pattern id="crt"
             width="4"
             height="4"
             patternUnits="userSpaceOnUse">
      <rect width="4"
            height="1"
            fill="#7DD3FC"
            opacity="0.03"/>
    </pattern>

    <!-- Glow -->
    <filter id="glow"
            x="-60%"
            y="-60%"
            width="220%"
            height="220%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .terminal-title {
        font-family: "Courier New", Consolas, monospace;
        font-size: 13px;
        fill: #64748B;
        letter-spacing: 0.5px;
      }

      .status {
        font-family: "Courier New", Consolas, monospace;
        font-size: 11px;
        fill: #00E5FF;
        font-weight: bold;
      }

      .category {
        font-family: "Courier New", Consolas, monospace;
        font-size: 10px;
        fill: #00E5FF;
        font-weight: bold;
        letter-spacing: 1px;
      }

      .tech {
        font-family: "Courier New", Consolas, monospace;
        font-size: 10px;
        fill: #E6EDF3;
      }

      .muted {
        font-family: "Courier New", Consolas, monospace;
        font-size: 9px;
        fill: #8B949E;
      }
    </style>

  </defs>


  <!-- =========================================================
       BACKGROUND
  ========================================================== -->

  <rect x="0"
        y="0"
        width="1200"
        height="500"
        rx="18"
        fill="url(#bgGlow)"/>

  <rect x="0"
        y="0"
        width="1200"
        height="500"
        rx="18"
        fill="url(#crt)"/>


  <!-- =========================================================
       TERMINAL HEADER
  ========================================================== -->

  <rect x="3"
        y="3"
        width="1194"
        height="50"
        rx="16"
        fill="#0B1120"
        fill-opacity="0.94"/>


  <!-- macOS dots -->

  <circle cx="28"
          cy="28"
          r="6"
          fill="#EF4444"/>

  <circle cx="51"
          cy="28"
          r="6"
          fill="#F59E0B"/>

  <circle cx="74"
          cy="28"
          r="6"
          fill="#10B981"/>


  <!-- Title -->

  <text x="600"
        y="34"
        text-anchor="middle"
        class="terminal-title">

    harvsclein@devos ~ % STACK.CONFIG

  </text>


  <!-- Status -->

  <circle cx="1060"
          cy="28"
          r="4"
          fill="#00E5FF"
          filter="url(#glow)">
    <animate
      attributeName="opacity"
      values="1;0.25;1"
      dur="1.5s"
      repeatCount="indefinite"/>
  </circle>

  <text x="1073"
        y="33"
        class="status">

    [DATA.LOG]

  </text>


  <!-- =========================================================
       MAIN PANEL
  ========================================================== -->

  <rect x="3"
        y="3"
        width="1194"
        height="494"
        rx="16"
        fill="none"
        stroke="url(#borderGrad)"
        stroke-width="2"
        opacity="0.78">

    <animate
      attributeName="opacity"
      values="0.45;0.9;0.45"
      dur="3.5s"
      repeatCount="indefinite"/>

  </rect>


  <!-- =========================================================
       CATEGORY HEADERS
  ========================================================== -->

  <text x="34"
        y="83"
