<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="610"
     viewBox="0 0 1200 610">

  <defs>

    <!-- Background -->
    <radialGradient id="bg"
                    cx="50%"
                    cy="0%"
                    r="100%">

      <stop offset="0%"
            stop-color="#111827"/>

      <stop offset="100%"
            stop-color="#0B0F19"/>

    </radialGradient>


    <!-- Border -->
    <linearGradient id="border"
                    x1="0%"
                    y1="0%"
                    x2="100%"
                    y2="100%">

      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#00E5FF"/>

    </linearGradient>


    <!-- Card gradient -->
    <linearGradient id="card"
                    x1="0%"
                    y1="0%"
                    x2="0%"
                    y2="100%">

      <stop offset="0%"
            stop-color="#1A1D21"/>

      <stop offset="100%"
            stop-color="#161B22"/>

    </linearGradient>


    <!-- Soft cyan glow -->
    <filter id="glow"
            x="-60%"
            y="-60%"
            width="220%"
            height="220%">

      <feGaussianBlur
        stdDeviation="4"
        result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>


    <!-- Subtle moving highlight -->
    <linearGradient id="shine"
                    x1="0%"
                    y1="0%"
                    x2="100%"
                    y2="0%">

      <stop offset="0%"
            stop-color="#00E5FF"
            stop-opacity="0"/>

      <stop offset="50%"
            stop-color="#00E5FF"
            stop-opacity="0.10"/>

      <stop offset="100%"
            stop-color="#00E5FF"
            stop-opacity="0"/>

      <animateTransform
        attributeName="gradientTransform"
        type="translate"
        from="-1 0"
        to="1 0"
        dur="5s"
        repeatCount="indefinite"/>

    </linearGradient>


    <!-- CRT lines -->
    <pattern id="lines"
             width="4"
             height="4"
             patternUnits="userSpaceOnUse">

      <rect width="4"
            height="1"
            fill="#7DD3FC"
            opacity="0.025"/>

    </pattern>


    <style>

      .title {
        font-family: "Courier New", Consolas, monospace;
        font-size: 20px;
        fill: #00F2FE;
        font-weight: bold;
        letter-spacing: 1px;
      }

      .subtitle {
        font-family: "Courier New", Consolas, monospace;
        font-size: 11px;
        fill: #8B949E;
        letter-spacing: 0.8px;
      }

      .category {
        font-family: "Courier New", Consolas, monospace;
        font-size: 10px;
        fill: #00E5FF;
        font-weight: bold;
        letter-spacing: 1.8px;
      }

      .name {
        font-family: "Courier New", Consolas, monospace;
        font-size: 10px;
        fill: #E6EDF3;
        font-weight: bold;
      }

    </style>

  </defs>


  <!-- =========================================================
       BACKGROUND
  ========================================================== -->

  <rect x="0"
        y="0"
        width="1200"
        height="610"
        rx="18"
        fill="url(#bg)"/>

  <rect x="0"
        y="0"
        width="1200"
        height="610"
        rx="18"
        fill="url(#lines)"/>


  <!-- =========================================================
       OUTER PANEL
  ========================================================== -->

  <rect x="3"
        y="3"
        width="1194"
        height="604"
        rx="18"
        fill="none"
        stroke="url(#border)"
        stroke-width="2"
        opacity="0.82">

    <animate
      attributeName="opacity"
      values="0.50;0.90;0.50"
      dur="3.5s"
      repeatCount="indefinite"/>

  </rect>


