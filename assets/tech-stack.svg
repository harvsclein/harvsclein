<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="405"
     viewBox="0 0 1200 405">

  <defs>

    <!-- =======================================================
         BACKGROUND
    ======================================================== -->

    <radialGradient id="bgGlow"
                    cx="50%"
                    cy="0%"
                    r="100%">

      <stop offset="0%" stop-color="#111827"/>
      <stop offset="60%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#050810"/>

    </radialGradient>


    <!-- =======================================================
         BORDER
    ======================================================== -->

    <linearGradient id="borderGrad"
                    x1="0%"
                    y1="0%"
                    x2="100%"
                    y2="100%">

      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#10B981"/>

    </linearGradient>


    <!-- =======================================================
         SCANLINE
    ======================================================== -->

    <linearGradient id="scanGrad"
                    x1="0%"
                    y1="0%"
                    x2="0%"
                    y2="100%">

      <stop offset="0%"
            stop-color="#00E5FF"
            stop-opacity="0"/>

      <stop offset="45%"
            stop-color="#00E5FF"
            stop-opacity="0.02"/>

      <stop offset="50%"
            stop-color="#B6F7FF"
            stop-opacity="0.48"/>

      <stop offset="55%"
            stop-color="#00E5FF"
            stop-opacity="0.02"/>

      <stop offset="100%"
            stop-color="#7C3AED"
            stop-opacity="0"/>

    </linearGradient>


    <!-- =======================================================
         CRT
    ======================================================== -->

    <pattern id="crt"
             width="4"
             height="4"
             patternUnits="userSpaceOnUse">

      <rect width="4"
            height="1"
            fill="#7DD3FC"
            opacity="0.025"/>

    </pattern>


    <!-- =======================================================
         GLOW
    ======================================================== -->

    <filter id="glow"
            x="-60%"
            y="-60%"
            width="220%"
            height="220%">

      <feGaussianBlur
        stdDeviation="3"
        result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>


    <!-- =======================================================
         TYPOGRAPHY
    ======================================================== -->

    <style>

      .terminal-title {
        font-family: "Courier New", Consolas, monospace;
        font-size: 11px;
        fill: #64748B;
        letter-spacing: 0.4px;
      }

      .status {
        font-family: "Courier New", Consolas, monospace;
        font-size: 9px;
        fill: #00E5FF;
        font-weight: bold;
      }

      .category {
        font-family: "Courier New", Consolas, monospace;
        font-size: 8px;
        fill: #00E5FF;
        font-weight: bold;
        letter-spacing: 1.2px;
      }

      .tech {
        font-family: "Courier New", Consolas, monospace;
        font-size: 8.5px;
        fill: #E6EDF3;
        font-weight: bold;
      }

      .glyph {
        font-family: "Courier New", Consolas, monospace;
        font-weight: bold;
      }

      .muted {
        font-family: "Courier New", Consolas, monospace;
        font-size: 7px;
        fill: #64748B;
      }

    </style>

  </defs>


  <!-- =========================================================
