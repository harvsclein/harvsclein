<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="650"
     viewBox="0 0 1200 650">

  <!-- =========================================================
       DEFINITIONS
  ========================================================== -->

  <defs>

    <!-- Background -->
    <radialGradient id="bgGlow2"
                     cx="35%"
                     cy="15%"
                     r="90%">

      <stop offset="0%" stop-color="#101827"/>
      <stop offset="55%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#050810"/>

    </radialGradient>


    <!-- Border -->
    <linearGradient id="borderGrad2"
                    x1="0%"
                    y1="0%"
                    x2="100%"
                    y2="100%">

      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#10B981"/>

    </linearGradient>


    <!-- Animated scanline -->
    <linearGradient id="scanGrad2"
                    x1="0%"
                    y1="0%"
                    x2="0%"
                    y2="100%">

      <stop offset="0%"
            stop-color="#00E5FF"
            stop-opacity="0"/>

      <stop offset="42%"
            stop-color="#00E5FF"
            stop-opacity="0.03"/>

      <stop offset="50%"
            stop-color="#B6F7FF"
            stop-opacity="0.55"/>

      <stop offset="58%"
            stop-color="#00E5FF"
            stop-opacity="0.03"/>

      <stop offset="100%"
            stop-color="#7C3AED"
            stop-opacity="0"/>

    </linearGradient>


    <!-- CRT texture -->
    <pattern id="scanlines2"
             width="4"
             height="4"
             patternUnits="userSpaceOnUse">

      <rect width="4"
            height="1"
            fill="#7DD3FC"
            opacity="0.035"/>

    </pattern>


    <!-- Glow -->
    <filter id="glow2"
            x="-50%"
            y="-50%"
            width="200%"
            height="200%">

      <feGaussianBlur
        stdDeviation="3"
        result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>


    <!-- Typography -->

    <style>

      .terminal {
        font-family: "Courier New", Consolas, monospace;
      }

      .title {
        font-family: "Courier New", Consolas, monospace;
        font-size: 12px;
        fill: #64748B;
        letter-spacing: 0.4px;
      }

      .status {
        font-family: "Courier New", Consolas, monospace;
        font-size: 11px;
        fill: #00E5FF;
        font-weight: bold;
      }

      .section {
        font-family: "Courier New", Consolas, monospace;
        font-size: 13px;
        fill: #00E5FF;
        font-weight: bold;
      }

      .label {
        font-family: "Courier New", Consolas, monospace;
        font-size: 11.5px;
        fill: #00E5FF;
        font-weight: bold;
      }

      .dots {
        font-family: "Courier New", Consolas, monospace;
        font-size: 11.5px;
        fill: #475569;
      }

      .value {
        font-family: "Courier New", Consolas, monospace;
        font-size: 11.5px;
        fill: #E6EDF3;
      }

      .muted {
        font-family: "Courier New", Consolas, monospace;
        font-size: 10.5px;
        fill: #8B949E;
      }

      .project {
        font-family: "Courier New", Consolas, monospace;
        font-size: 11px;
        fill: #E6EDF3;
      }

      .green {
        font-family: "Courier New", Consolas, monospace;
        font-size: 11px;
        fill: #10B981;
        font-weight: bold;
      }

    </style>

  </defs>


  <!-- =========================================================
       BACKGROUND
  ========================================================== -->

  <rect x="0"
        y="0"
        width="1200"
        height="650"
        rx="18"
        fill="url(#bgGlow2)"/>

  <rect x="0"
        y="0"
        width="1200"
        height="650"
        rx="18"
        fill="url(#scanlines2)"/>


  <!-- =========================================================
       TOP TERMINAL BAR
  ========================================================== -->

  <rect x="3"
        y="3"
        width="1194"
        height="50"
        rx="16"
        fill="#0B1120"
        fill-opacity="0.94"/>


  <!-- macOS buttons -->

  <circle cx="28"
          cy="28"
          r="6"
          fill="#EF4444">

    <animate
      attributeName="opacity"
      values="1;0.55;1"
      dur="4s"
      repeatCount="indefinite"/>

  </circle>


  <circle cx="51"
          cy="28"
          r="6"
          fill="#F59E0B">

    <animate
      attributeName="opacity"
      values="1;0.55;1"
      dur="4s"
      begin="0.3s"
      repeatCount="indefinite"/>

  </circle>


  <circle cx="74"
          cy="28"
          r="6"
          fill="#10B981">

    <animate
      attributeName="opacity"
      values="1;0.55;1"
      dur="4s"
      begin="0.6s"
      repeatCount="indefinite"/>

  </circle>


  <!-- Terminal title -->

  <text x="600"
        y="34"
        text-anchor="middle"
        class="title">

    harvsclein@devos ~ % ./overview.sh --extended

  </text>


  <!-- Status -->

  <circle cx="1065"
          cy="28"
          r="4"
          fill="#00E5FF"
          filter="url(#glow2)">

    <animate
      attributeName="opacity"
      values="1;0.2;1"
      dur="1.5s"
      repeatCount="indefinite"/>

  </circle>


  <text x="1077"
        y="33"
        class="status">

    [DATA.LOG]

  </text>


  <!-- =========================================================
       MAIN TWO-COLUMN LAYOUT
  ========================================================== -->

  <!-- Divider -->

  <line x1="600"
        y1="76"
        x2="600"
        y2="620"
        stroke="#00E5FF"
        stroke-opacity="0.18"/>


  <!-- Left panel -->

  <rect x="24"
        y="72"
        width="550"
        height="555"
        rx="14"
        fill="#0B1120"
        fill-opacity="0.30"
        stroke="url(#borderGrad2)"
        stroke-width="1"
        opacity="0.48"/>


  <!-- Right panel -->

  <rect x="626"
        y="72"
        width="550"
        height="555"
        rx="14"
        fill="#0B1120"
        fill-opacity="0.30"
        stroke="url(#borderGrad2)"
        stroke-width="1"
        opacity="0.48"/>


  <!-- =========================================================
       LEFT: ABOUT ME
  ========================================================== -->

  <text x="48"
        y="104"
        class="section">

    cat about_me.txt

  </text>


  <line x1="48"
        y1="118"
        x2="550"
        y2="118"
        stroke="#00E5FF"
        stroke-opacity="0.20"/>


  <text x="48"
        y="145"
        class="value">

    <tspan x="48" dy="0">
      I'm a BSIT student focused on turning data and code into
    </tspan>

    <tspan x="48" dy="20">
      practical solutions, with a growing interest in Data
    </tspan>

    <tspan x="48" dy="20">
      Analytics and Data Engineering.
    </tspan>

  </text>


  <text x="48"
        y="220"
        class="muted">

    philosophy . . . . . . . . . . . . learn → build → analyze → improve

  </text>


  <!-- =========================================================
       EDUCATION
  ========================================================== -->

  <text x="48"
        y="266"
        class="section">

    ls -la ./academic/

  </text>


  <line x1="48"
        y1="280"
        x2="550"
        y2="280"
        stroke="#00E5FF"
        stroke-opacity="0.20"/>


  <text x="48"
        y="309">

    <tspan class="label">Degree</tspan>
    <tspan class="dots"> . . . . . . . . . . </tspan>
    <tspan class="value">BS Information Technology</tspan>

  </text>


  <text x="48"
        y="333">

    <tspan class="label">Level</tspan>
    <tspan class="dots"> . . . . . . . . . . . . </tspan>
    <tspan class="value">2nd Year</tspan>

  </text>


  <text x="48"
        y="357">

    <tspan class="label">Institution</tspan>
    <tspan class="dots"> . . . . . . </tspan>
    <tspan class="value">Polytechnic University of the Philippines</tspan>

  </text>


  <text x="48"
        y="392"
        class="green">

    KEY COURSEWORK

  </text>


  <text x="48"
        y="416"
        class="muted">

    ├─ Computer Architecture &amp; Logic Systems

  </text>


  <text x="48"
        y="438"
        class="muted">

    ├─ Data Structures &amp; Algorithms

  </text>


  <text x="48"
        y="460"
        class="muted">

    ├─ Discrete Mathematics &amp; Formal Logic

  </text>


  <text x="48"
        y="482"
        class="muted">

    ├─ Database Management Systems

  </text>


  <text x="48"
        y="504"
        class="muted">

    └─ Software Engineering &amp; Web Development

  </text>


  <!-- =========================================================
       RIGHT: ACTIVE PROJECTS
  ========================================================== -->

  <text x="650"
        y="104"
        class="section">

    ./get_active_projects.sh

  </text>


  <line x1="650"
        y1="118"
        x2="1152"
        y2="118"
        stroke="#00E5FF"
        stroke-opacity="0.20"/>


  <!-- Project 1 -->

  <text x="650"
        y="148"
        class="green">

    [01] GLOBAL LAYOFFS ANALYSIS

  </text>


  <text x="650"
        y="170"
        class="project">

    SQL-based data cleaning and exploratory analysis

  </text>


  <text x="650"
        y="190"
        class="muted">

    └─ MySQL • Data Cleaning • EDA

  </text>


  <!-- Project 2 -->

  <text x="650"
        y="230"
        class="green">

    [02] AI JOB MARKET ANALYSIS

  </text>


  <text x="650"
        y="252"
        class="project">

    Python + Power BI analysis of the global AI job market

  </text>


  <text x="650"
        y="272"
        class="muted">

    └─ Python • Pandas • Power BI

  </text>


  <!-- Project 3 -->

  <text x="650"
        y="312"
        class="green">

    [03] VIDEO GAME SALES ANALYSIS

  </text>


  <text x="650"
        y="334"
        class="project">

    Sales performance analysis across platforms and regions

  </text>


  <text x="650"
        y="354"
        class="muted">

    └─ Python • EDA • Power BI

  </text>


  <!-- Project 4 -->

  <text x="650"
        y="394"
        class="green">

    [04] JOB RECRUITMENT FUNNEL

  </text>


  <text x="650"
        y="416"
        class="project">

    Funnel analysis of applications, interviews and offers

  </text>


  <text x="650"
        y="436"
        class="muted">

    └─ Python • Pandas • Conversion Analysis

  </text>


  <!-- Current goal -->

  <text x="650"
        y="480"
        class="green">

    CURRENT.GOAL

  </text>


  <text x="650"
        y="505"
        class="value">

    <tspan x="650" dy="0">
      Build stronger end-to-end analytics projects
    </tspan>

    <tspan x="650" dy="20">
      while developing the skills needed for Data
    </tspan>

    <tspan x="650" dy="20">
      Analytics and Data Engineering.
    </tspan>

  </text>


  <!-- =========================================================
       SKILLS / SOFT SKILLS
  ========================================================== -->

  <text x="650"
        y="575"
        class="section">

    ./skills --soft

  </text>


  <text x="650"
        y="598"
        class="muted">

    Analytical Thinking • Problem Solving • Active Learning

  </text>


  <text x="650"
        y="616"
        class="muted">

    Version Control • Team Collaboration

  </text>


  <!-- =========================================================
       TERMINAL CURSOR
  ========================================================== -->

  <rect x="1118"
        y="582"
        width="8"
        height="15"
        fill="#00E5FF">

    <animate
      attributeName="opacity"
      values="0;0;1;0;1;0;1;0"
      keyTimes="0;0.01;0.02;0.3;0.5;0.7;0.85;1"
      dur="1.4s"
      repeatCount="indefinite"/>

  </rect>


  <!-- =========================================================
       MOVING SCANLINE
  ========================================================== -->

  <rect x="0"
        y="-110"
        width="1200"
        height="110"
        fill="url(#scanGrad2)"
        opacity="0.72"
        style="mix-blend-mode:screen">

    <animateTransform
      attributeName="transform"
      type="translate"
      from="0 -110"
      to="0 760"
      dur="6.5s"
      repeatCount="indefinite"/>

  </rect>


  <!-- =========================================================
       OUTER BORDER
  ========================================================== -->

  <rect x="3"
        y="3"
        width="1194"
        height="644"
        rx="16"
        fill="none"
        stroke="url(#borderGrad2)"
        stroke-width="2"
        opacity="0.78">

    <animate
      attributeName="opacity"
      values="0.45;0.9;0.45"
      dur="3.2s"
      repeatCount="indefinite"/>

  </rect>

</svg>
